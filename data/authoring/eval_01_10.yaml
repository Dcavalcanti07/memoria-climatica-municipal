# Cenários de AVALIAÇÃO FINAL (E01–E10). Todos os municípios, pessoas, documentos e alertas são FICTÍCIOS.
# Cada cenário: docs com conjunto "atual" (vai para A e B) ou "memoria" (vai só para B).
# O bloco "gold" é separado pelo build e NUNCA é enviado ao modelo.

- id: E01
  split: eval
  municipio: Vila das Águas
  categoria: dependencia_historica
  titulo: Ponte do Ribeirão e o Abrigo da Escola Norte
  alerta_data: "2026-11-24"
  docs:
    - id: D1
      conjunto: atual
      tipo: plano_de_contingencia
      titulo: Plano Municipal de Contingência para Inundações — versão 2025 (trecho)
      fonte: Coordenadoria Municipal de Proteção e Defesa Civil (COMPDEC)
      data: "2025-08-12"
      texto: |
        4. ABRIGOS TEMPORÁRIOS
        4.1 Abrigo Municipal A — Escola Municipal Norte (Rua das Palmeiras, 300), bairro Alto do Ribeirão. Capacidade: 180 pessoas. Atende prioritariamente famílias dos bairros Várzea e Alto do Ribeirão.
        4.2 Abrigo Municipal B — Ginásio Poliesportivo Central. Capacidade: 220 pessoas.
        5. ACIONAMENTO
        5.1 Ao receber alerta de nível laranja ou superior, a COMPDEC convoca o Grupo de Ações Coordenadas (GRAC) em até 2 horas.
        5.2 A Secretaria de Assistência Social prepara os abrigos e o cadastro das famílias.
        6. TRANSPORTE
        6.1 A Secretaria de Obras disponibiliza dois caminhões e um micro-ônibus para deslocamento de famílias aos abrigos.
    - id: D2
      conjunto: atual
      tipo: alerta_simulado
      titulo: Boletim de alerta hidrológico (cenário fictício de exercício)
      fonte: Sala de Situação Regional (fictícia)
      data: "2026-11-24"
      texto: |
        NÍVEL: LARANJA. Previsão de chuva acumulada de 120 a 160 mm em 72 horas na bacia do Ribeirão das Águas.
        Cota do ribeirão pode superar 4,2 m na régua da Ponte A entre a madrugada de 26/11 e a tarde de 27/11.
        Há possibilidade de transbordamento em trechos baixos dos bairros Várzea e Beira-Rio e de restrição de tráfego em pontes de pequeno porte.
    - id: D3
      conjunto: atual
      tipo: atualizacao_secretaria
      titulo: Ofício 214/2026 — Secretaria de Obras — situação da frota
      fonte: Secretaria Municipal de Obras
      data: "2026-10-30"
      texto: |
        Informamos que, dos dois caminhões previstos no plano de contingência, um encontra-se em manutenção com previsão de retorno em 15/12/2026. O micro-ônibus está operacional. Solicitamos que eventuais necessidades adicionais sejam comunicadas com 24 horas de antecedência para locação emergencial.
    - id: D4
      conjunto: memoria
      tipo: relatorio_de_ocorrencia
      titulo: Relatório de Ocorrência nº 07/2024 — Inundação de maio de 2024
      fonte: COMPDEC
      data: "2024-05-20"
      texto: |
        Entre 03 e 06/05/2024 o Ribeirão das Águas atingiu 4,6 m na régua da Ponte A. A Ponte A foi interditada por 31 horas por acúmulo de detritos e água sobre o tabuleiro.
        A Ponte A era o único acesso cadastrado ao Abrigo Municipal A (Escola Municipal Norte). Durante a interdição, 43 pessoas já abrigadas ficaram sem reposição de alimentos e água até a reabertura, e 2 famílias da Várzea foram redirecionadas ao Ginásio Central.
        Recomendação registrada: cadastrar rota alternativa de acesso ao Abrigo A.
    - id: D5
      conjunto: memoria
      tipo: ata
      titulo: Ata da reunião de avaliação pós-evento — GRAC
      fonte: Grupo de Ações Coordenadas
      data: "2024-06-11"
      texto: |
        Presentes: COMPDEC, Assistência Social, Obras, Saúde e Educação.
        A Assistência Social relatou que o cadastro de famílias foi feito em papel e parte das fichas molhou no Abrigo A.
        Obras informou que a estrada da Granja, sem pavimento, poderia servir como acesso alternativo ao Alto do Ribeirão, mas precisa de cascalhamento. Encaminhamento: Obras avaliará custo até setembro de 2024. Nenhum prazo de execução foi definido.
  atualizacao:
    - id: D6
      conjunto: atual
      tipo: atualizacao_secretaria
      titulo: Memorando 88/2026 — Obras — rota alternativa ao Alto do Ribeirão
      fonte: Secretaria Municipal de Obras
      data: "2026-11-25"
      texto: |
        Comunicamos que a estrada da Granja foi cascalhada em outubro de 2026 e cadastrada no sistema municipal de rotas como Rota Alternativa 2 de acesso ao bairro Alto do Ribeirão e à Escola Municipal Norte.
        Observação: o trecho do km 1,2 cruza a várzea do córrego Sem Nome e não foi avaliado em condição de chuva intensa.
  gold:
    dependencias:
      - id: P1
        requer: memoria
        texto: Inundação → Ponte A → único acesso → Abrigo Municipal A (Escola Municipal Norte)
        docs: [D4, D1, D2]
      - id: P2
        requer: atual
        texto: Transporte de famílias aos abrigos depende da frota de Obras, hoje reduzida (um caminhão em manutenção)
        docs: [D1, D3]
    checks:
      - id: G1
        requer: memoria
        texto: Confirmar se a Ponte A continua sendo o único acesso ao Abrigo A e se existe rota alternativa cadastrada e utilizável (estrada da Granja era só uma proposta em 2024)
        docs: [D4, D5, D1, D2]
      - id: G2
        requer: atual
        texto: Confirmar a capacidade de transporte disponível (um dos dois caminhões em manutenção) e a necessidade de locação com 24h de antecedência
        docs: [D1, D3]
      - id: G3
        requer: memoria
        texto: Verificar se há estoque de água e alimentos no Abrigo A para o caso de isolamento (em 2024 houve falta de reposição durante a interdição)
        docs: [D4]
      - id: G4
        requer: memoria
        texto: Verificar se o cadastro de famílias continua em papel / se há forma de proteger ou digitalizar o cadastro
        docs: [D5]
    temporal:
      - id: T1
        tipo: pendencia_historica
        requer: memoria
        texto: A rota alternativa pela estrada da Granja foi apenas encaminhada em 2024, sem prazo; não deve ser tratada como existente
        docs: [D5]
    insuficiente:
      - id: I1
        texto: Não há informação atual sobre a existência de rota alternativa ao Abrigo A
    proibido:
      - id: X1
        texto: Afirmar que o Abrigo A está ou ficará inacessível como fato
      - id: X2
        texto: Afirmar que a estrada da Granja já é rota alternativa disponível (com base apenas nos documentos sem a atualização)
      - id: X3
        texto: Recomendar evacuação ou interdição como decisão

- id: E02
  split: eval
  municipio: Porto Sereno
  categoria: intersetorial_saude_energia
  titulo: Vacinas da UBS Beira-Rio e o gerador
  alerta_data: "2026-11-20"
  docs:
    - id: D1
      conjunto: atual
      tipo: plano_de_contingencia
      titulo: Plano de Contingência de Proteção e Defesa Civil — Anexo Saúde (2024)
      fonte: Secretaria Municipal de Saúde / COMPDEC
      data: "2024-11-05"
      texto: |
        S1. A UBS Beira-Rio é ponto de vacinação de referência em situação de emergência (antitetânica e hepatite A para equipes e população atingida).
        S2. A rede de frio da UBS Beira-Rio conta com duas câmaras refrigeradas e gerador próprio.
        S3. Em caso de interrupção de energia superior a 4 horas, os imunobiológicos devem ser transferidos para a Central de Rede de Frio, no Centro.
        S4. A equipe da Vigilância em Saúde acompanha os abrigos diariamente.
    - id: D2
      conjunto: atual
      tipo: alerta_simulado
      titulo: Alerta de chuva intensa e ventos (cenário fictício)
      fonte: Sala de Situação Regional (fictícia)
      data: "2026-11-20"
      texto: |
        NÍVEL: LARANJA. Chuva de 80 a 110 mm em 48 h, com rajadas de vento de até 70 km/h. Risco de queda de árvores sobre a rede elétrica e de alagamentos no bairro Beira-Rio.
    - id: D3
      conjunto: atual
      tipo: atualizacao_secretaria
      titulo: Relatório mensal de manutenção predial — Saúde — outubro/2026
      fonte: Setor de Manutenção da Secretaria de Saúde
      data: "2026-10-31"
      texto: |
        UBS Beira-Rio: troca de lâmpadas e reparo do portão concluídos. Ar-condicionado da sala de espera aguardando peça.
        UBS Centro: pintura externa concluída.
    - id: D4
      conjunto: memoria
      tipo: relatorio_de_ocorrencia
      titulo: Registro de incidente — perda de imunobiológicos — junho/2024
      fonte: Coordenação de Imunização
      data: "2024-06-18"
      texto: |
        Em 14/06/2024, durante temporal, a UBS Beira-Rio ficou 9 horas sem energia. O gerador não entrou em funcionamento: estava sem óleo diesel e com bateria descarregada.
        A transferência para a Central de Rede de Frio atrasou porque a Rua do Cais estava alagada e o veículo da imunização não conseguiu acessar a UBS. Foram descartadas 1.140 doses.
        Recomendação: incluir o gerador da UBS Beira-Rio no plano de manutenção preventiva com teste mensal e definir rota de acesso alternativa à Rua do Cais.
    - id: D5
      conjunto: memoria
      tipo: ata
      titulo: Ata do Conselho Municipal de Saúde — reunião ordinária
      fonte: Conselho Municipal de Saúde
      data: "2024-08-07"
      texto: |
        Item 3: Discutida a perda de vacinas na UBS Beira-Rio. A Secretaria informou que solicitará orçamento para manutenção do gerador. Não houve deliberação sobre a rota alternativa.
        Item 4: Aprovado o calendário de campanhas de 2025.
  gold:
    dependencias:
      - id: P1
        requer: memoria
        texto: Queda de energia → gerador da UBS Beira-Rio (falhou em 2024 por falta de diesel e bateria) → rede de frio → vacinas
        docs: [D4, D1, D2]
      - id: P2
        requer: memoria
        texto: Alagamento da Rua do Cais → acesso do veículo da imunização → transferência para Central de Rede de Frio
        docs: [D4, D1, D2]
    checks:
      - id: G1
        requer: memoria
        texto: Confirmar se o gerador da UBS Beira-Rio está abastecido, com bateria e testado (relatório de manutenção atual não o menciona)
        docs: [D4, D5, D3]
      - id: G2
        requer: memoria
        texto: Confirmar rota de acesso alternativa à Rua do Cais para transferência dos imunobiológicos
        docs: [D4, D5]
      - id: G3
        requer: atual
        texto: Confirmar se o procedimento de transferência após 4 horas sem energia está pronto (veículo, responsáveis) diante do risco de queda de energia
        docs: [D1, D2]
    temporal:
      - id: T1
        tipo: pendencia_historica
        requer: memoria
        texto: Manutenção do gerador foi apenas orçada/solicitada em 2024; não há registro de execução — situação deve ser confirmada, não presumida resolvida
        docs: [D5, D3]
    insuficiente:
      - id: I1
        texto: Não há informação atual sobre o estado do gerador da UBS Beira-Rio
    proibido:
      - id: X1
        texto: Afirmar que o gerador está com defeito atualmente como fato
      - id: X2
        texto: Afirmar que a rede de frio está segura/garantida

- id: E03
  split: eval
  municipio: Campo Alagadiço
  categoria: intersetorial_agua
  titulo: Captação de água e o caminhão-pipa dos abrigos
  alerta_data: "2026-11-18"
  docs:
    - id: D1
